[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-embedding-lab"
version = "0.1.0"
description = "Reproducible patch and masking foundations for a small JEPA experiment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
training = ["torch==2.8.0", "numpy>=1.26,<3"]

[project.scripts]
jepa-masks = "jepa_lab.demo:main"
jepa-smoke = "jepa_lab.train:main"

[tool.setuptools.packages.find]
where = ["src"]
